# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
---
name: Mobile preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - unlabeled
    # Most PRs here are web-only. Publishing an update for those would burn
    # EAS quota and post a comment nobody needs, so scope this to the code
    # that actually ends up in the mobile bundle.
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-preview.yml"
  repository_dispatch:
    types: [preview-command]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.client_payload.pull_request.number }}
  # Unlike the staging deploys, a superseded preview is just wasted minutes —
  # only the newest commit on the PR is worth publishing.
  cancel-in-progress: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}

jobs:
  preview:
    # Forked PRs get no access to secrets, so EXPO_TOKEN would arrive empty and
    # the publish would fail with an opaque auth error rather than an obvious
    # one. Skip them instead, and let a maintainer run `/preview` on the PR.
    if: >-
      github.event_name == 'repository_dispatch' ||
      (
        !contains(github.event.pull_request.labels.*.name, 'no preview') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.pull_request.head.sha }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A missing secret otherwise surfaces deep inside the publish step as an
      # opaque auth failure. Fail here instead, naming what to add and where.
      - name: Check the Expo credentials are configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set. Add a robot token owned by the ethanchaos-team org (https://expo.dev/settings/access-tokens) as a repository secret. See apps/mobile/README.md."
            exit 1
          fi
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::EAS_PROJECT_ID is not set. Add it as a repository *variable* under Settings > Secrets and variables > Actions. See apps/mobile/README.md."
            exit 1
          fi

      # The preview action probes a bare `eas --version` before running its
      # command, and pnpm links binaries only into the owning package's
      # node_modules/.bin. Exposing that is preferable to installing a second
      # copy of eas-cli: CI then runs exactly the version in the lockfile.
      - name: Put the project's eas-cli on PATH
        run: echo "$GITHUB_WORKSPACE/apps/mobile/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Publish preview update and comment on the PR
        uses: expo/expo-github-action/preview@v9
        with:
          working-directory: apps/mobile
          # `--environment` is mandatory whenever eas runs without a TTY.
          # The message is built only from the PR number and commit SHA:
          # a PR *title* is attacker-controlled text and would be a shell
          # injection vector once interpolated into a run command.
          command: >-
            eas update
            --branch pr-${{ github.event.pull_request.number || github.event.client_payload.pull_request.number }}
            --environment preview
            --message "PR #${{ github.event.pull_request.number || github.event.client_payload.pull_request.number }} @ ${{ github.event.pull_request.head.sha || github.event.client_payload.pull_request.head.sha }}"
          # These updates are keyed to the SDK runtime (`sdkVersion` policy in
          # app.config.ts), so a stock Expo Go install can open them. Targeting
          # a dev build instead would require every reviewer to install one.
          qr-target: expo-go
          comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add reaction to comment
        if: github.event_name == 'repository_dispatch'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          reactions: rocket
