# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
---
name: PR checks

# Lint, format, the three typechecks and the shared tests on every PR. Before this workflow,
# CLAUDE.md said "CI does not run typechecks — you are the gate", which meant
# a PR author forgetting one command shipped a type error to main.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only the newest commit on a PR is worth checking. On main every merge
  # keeps its own result, so back-to-back merges don't cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `biome ci` is `biome check` without writes; the github reporter turns
      # each diagnostic into an inline annotation on the PR's Files tab.
      - name: Lint and format (Biome)
        run: pnpm exec biome ci --reporter=github

      - name: Typecheck shared (TS 5.9)
        if: ${{ !cancelled() }}
        run: pnpm --filter @zotmeet/shared typecheck

      - name: Test shared
        if: ${{ !cancelled() }}
        run: pnpm --filter @zotmeet/shared test

      - name: Typecheck web (TS 5.9)
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      # `expo-env.d.ts` is generated by `expo start` and gitignored, so a fresh
      # checkout lacks it. Without it TS can't type `import "../global.css"`
      # (TS2882). Write the same one-line file Expo generates.
      - name: Typecheck mobile (TS 6.0)
        if: ${{ !cancelled() }}
        run: |
          echo '/// <reference types="expo/types" />' > apps/mobile/expo-env.d.ts
          pnpm --filter @zotmeet/mobile typecheck
