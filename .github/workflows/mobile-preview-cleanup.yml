# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
---
name: Cleanup mobile preview

# `pull_request_target`, not `pull_request`: a fork PR can be previewed by a
# maintainer running `/preview` (see mobile-preview.yml), and that publishes a
# `pr-<n>` branch like any other. A `pull_request` run from a fork gets no
# secrets, so `EXPO_TOKEN` would be empty and its branch could never be
# deleted — the leak this workflow exists to prevent.
#
# The usual `pull_request_target` hazard is running untrusted code with the
# base repo's secrets. That does not apply here: the checkout below takes the
# base ref (the default for this trigger, no `ref:` override), nothing from the
# PR head is fetched or executed, and the only PR-derived value used is the
# pull request *number*, which is an integer.
on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
  PR_NUM: ${{ github.event.pull_request.number }}

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Update branches accumulate one per PR forever otherwise. A web-only PR
      # never published one, so a missing branch is the normal case and must
      # not fail the run — but only that case. Swallowing every failure would
      # report an auth error or an EAS outage as a clean cleanup and let the
      # branch leak silently, which is the opposite of what this job is for.
      - name: Delete the PR's update branch
        working-directory: apps/mobile
        run: |
          set +e
          output=$(pnpm exec eas branch:delete "pr-$PR_NUM" --non-interactive 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # Both halves must land on the same line: a bare "not found" also
          # matches a bad EAS_PROJECT_ID ("Project not found"), a GraphQL 404,
          # or a token failure — errors that must not pass as a clean cleanup.
          if printf '%s\n' "$output" \
            | grep -E "pr-$PR_NUM([^0-9]|$)" \
            | grep -qiE "not found|does not exist|doesn't exist"; then
            echo "::notice::No update branch pr-$PR_NUM to delete."
            exit 0
          fi

          echo "::error::Could not delete update branch pr-$PR_NUM; it may now be orphaned."
          exit "$status"
