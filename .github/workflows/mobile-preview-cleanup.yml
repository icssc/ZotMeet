# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
---
name: Cleanup mobile preview

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
  PR_NUM: ${{ github.event.pull_request.number }}

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Update branches accumulate one per PR forever otherwise. A web-only PR
      # never published one, so a missing branch is the normal case, not a
      # failure — don't fail the run over it.
      - name: Delete the PR's update branch
        working-directory: apps/mobile
        run: |
          pnpm exec eas branch:delete "pr-$PR_NUM" --non-interactive \
            || echo "No update branch pr-$PR_NUM to delete."
